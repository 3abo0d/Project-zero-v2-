name: Project zero v2 Probe (from ZIP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source ZIP
        run: |
          ls -l
          unzip -q Project-zero-v2.zip -d _src
          ls -l _src/Project-zero-v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android platform 36 and build-tools 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | bash "$SDKMANAGER" --licenses > /dev/null || true
          bash "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: _src/Project-zero-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK packaging (not a runtime test)
        run: |
          APK=_src/Project-zero-v2/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -E "classes.dex|assets/xposed_init|AndroidManifest.xml"
          unzip -p "$APK" assets/xposed_init
          unzip -p "$APK" classes.dex | strings | grep -c "com/liquidglass/nativecc/v2/V2Entry"

      - uses: actions/upload-artifact@v4
        with:
          name: Project-zero-v2-probe-debug
          path: _src/Project-zero-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
